[package]
name = "rifref"
version = "0.1.0"
edition = "2021"
description = "An infinite-canvas reference board for images, notes and sketches (PureRef-like)"

[dependencies]
eframe = { version = "0.33", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "rayon"] }
rfd = "0.15"
arboard = { version = "3.6", features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hayro = "0.8"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
